name: Production Deploy

# A feature branch merged into `main` (via its own PR — never from `staging`) is checked for
# staging provenance, tested again, and deployed to the production environment (Vercel
# "Production", Firestore database "(default)", https://docsync.analogdigital.tech) after the
# owner approves the run on the `production` GitHub environment.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  provenance:
    name: Staging Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit on main must have shipped to staging first
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash scripts/ci/branch-policy.sh push "$BEFORE" "$AFTER"

  quality:
    name: Quality
    needs: [provenance]
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to Production
    needs: [quality]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docsync.analogdigital.tech
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: bash scripts/ci/deploy.sh production

  verify:
    name: Post-Deploy Verification (Production)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Contract tests against production
        env:
          TARGET_URL: https://docsync.analogdigital.tech
          EXPECTED_ENVIRONMENT: production
          EXPECTED_VERSION: ${{ github.sha }}
          CI: true
        run: npm run test:contract
      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-contract-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14
      - name: How to roll back
        if: failure()
        run: |
          echo "::error title=Production verification failed::Roll back now: Vercel dashboard → Project → Deployments → previous production deployment → Instant Rollback (or 'vercel rollback' with a token). Then 'git revert -m 1 <merge-sha>' on a new branch and ship the revert through staging → main."
