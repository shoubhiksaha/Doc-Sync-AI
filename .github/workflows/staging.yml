name: Staging Deploy

# A feature branch merged into `staging` (via PR, merge commit) is tested again and then
# deployed to the staging environment: the Vercel "Preview" environment (aliased to
# vars.STAGING_DOMAIN when set) and Firestore database "staging".
# The deploy job waits for the owner's approval on the `staging` GitHub environment.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to Staging
    needs: [quality]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment_url || vars.STAGING_URL }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: bash scripts/ci/deploy.sh staging

  verify:
    name: Post-Deploy Verification (Staging)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Contract tests against staging
        env:
          TARGET_URL: ${{ needs.deploy.outputs.deployment_url || vars.STAGING_URL }}
          EXPECTED_ENVIRONMENT: staging
          EXPECTED_VERSION: ${{ github.sha }}
          # Repository-level secret (this job has no environment, so it can't read environment secrets).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: true
        run: npm run test:contract
      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staging-contract-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14
